# MotionKlip campaigns — https://discord.gg/motionklip
# Payout = (views_valid / 1000) * cpm   (mode=per_video)  |  fixed payout (mode=fixed)
# Diambil langsung dari Discord 2026-11-02 (akun adit06764, Server Tag MKLP aktif).
# Semua campaign Windah di bawah: watermark template wajib, Server Tag MKLP wajib,
# hashtag urutan tetap #windahbasudara #windahMKLIP2 #motionklip #ezklip.
campaigns:
  # ---------- BUDGET HABIS: jangan dipakai ----------
  - id: windah-mklip
    label: "Windah X Motion Klip"
    source: windah
    platforms: [tiktok, youtube, instagram, x, threads]
    mode: fixed
    cpm: 2000.0
    fixed_payout: 400000.0
    min_views: 200000
    max_claim_views: 0
    payout_methods: [gopay, dana]
    hashtags: "#windahbasudara #windahMKLIP2 #motionklip #ezklip"
    watermark: "MKLP"
    watermark_image: assets/motionklip-watermark.png
    required_tag: MKLP
    max_videos_per_month: 2
    budget_left_pct: 0.0
    active: false
    verified: true
    note: "Rp400.000 fixed per video 200.000 views. Maks 2 video/bulan/akun. BUDGET 0% -> MATI."

